<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RUU - System Optimizer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 40px;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; margin-bottom: 30px; }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      width: 250px;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover { transform: scale(1.02); }
    #gaming { background: #f43f5e; color: white; }
    #coding { background: #10b981; color: white; }
    #status {
      margin-top: 30px;
      font-size: 16px;
      color: #38bdf8;
      min-height: 24px;
    }
    .spinner {
      display: none;
      margin: 20px auto;
      border: 3px solid #1e293b;
      border-top: 3px solid #38bdf8;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>RUU Optimizer</h1>
  <p>Select your workspace mode</p>
  <div class="btn-container">
    <button id="gaming">Optimize for Gaming</button>
    <button id="coding">Optimize for Coding</button>
  </div>
  <div class="spinner" id="spinner"></div>
  <div id="status"></div>
  <script src="./renderer.js"></script>
</body>
</html>
