<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISTINAF - FF7 Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="window">
            <div class="title-bar">
                <div class="title">ISTINAF</div>
                <div class="subtitle">Pomodoro System v7.0</div>
            </div>
            
            <div class="content">
                <div class="timer-display">
                    <div class="time" id="timer">25:00</div>
                    <div class="mode" id="mode">WORK MODE</div>
                </div>

                <div class="materia-orb" id="materia">
                    <div class="orb-glow"></div>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Pomodoros</span>
                        <span class="stat-value" id="pomodoros">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Level</span>
                        <span class="stat-value" id="level">1</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-start" id="startBtn">START</button>
                    <button class="btn btn-reset" id="resetBtn">RESET</button>
                </div>

                <div class="message" id="message">Ready to focus?</div>
            </div>
        </div>
    </div>
