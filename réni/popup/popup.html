<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réni - Ad Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">r</div>
        <h1>Réni</h1>
      </div>
      <p class="subtitle">Ad Blocker</p>
    </header>

    <div class="stats-section">
      <div class="stat">
        <span class="stat-value" id="blockedCount">0</span>
        <span class="stat-label">Blocked on this page</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="totalBlocked">0</span>
        <span class="stat-label">Total blocked</span>
      </div>
    </div>

    <div class="toggle-section">
      <div class="toggle-label">
        <span class="toggle-text" id="statusText">Active</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleSwitch" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="actions">
      <button id="resetBtn" class="btn btn-secondary">Reset Stats</button>
    </div>

    <footer>
      <p class="version">v1.0.0</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
