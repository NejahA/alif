<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ashned — @NejahA</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header class="hero">
      <div class="container">
        <div class="profile">
          <div class="avatar-wrapper">
            <img id="avatar" src="" alt="avatar" />
            <div class="status-dot"></div>
          </div>
          <div class="profile-info">
            <h1 id="name">—</h1>
            <p id="bio" class="bio"></p>
            <div class="stats">
              <div class="stat"><span id="repos-count">0</span><label>repos</label></div>
              <div class="stat"><span id="followers-count">0</span><label>followers</label> </div>
              <div class="stat"><span id="following-count">0</span><label>following</label></div>
            </div>
            <div class="links">
              <a id="github-link" href="https://github.com/NejahA" target="_blank" class="btn btn-ghost">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.73.083-.73 1.205.085 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/></svg>
                GitHub
              </a>
              <a id="website-link" href="#" target="_blank" class="btn btn-outline">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                Website
              </a>
            </div> 
          </div>
        </div>
      </div>
    </header>
    <main class="container">
      <section class="section">
        <div class="section-header">
          <h2>Repositories</h2>
          <span id="repo-total" class="badge"></span>
        </div>
        <div id="repos-grid" class="repos-grid">
          <div class="loading">Loading repositories…</div>
        </div>
      </section>
      <section class="section">
        <div class="section-header">
          <h2>Contribution Graph</h2>
        </div>
        <div id="contributions" class="contrib-card">
          <div class="loading">Loading contributions…</div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <p>ashned · built with <a href="https://github.com/NejahA" target="_blank">@NejahA</a></p>
      </div>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
