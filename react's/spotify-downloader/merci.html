<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci - Media Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      color: #ff4757;
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5em;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    input[type="text"] {
      flex: 1;
      padding: 15px 20px;
      border: 2px solid #2a2a4a;
      border-radius: 8px;
      background: #1a1a2e;
      color: white;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      border-color: #ff4757;
    }
    button {
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      background: #ff4757;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #ff6b81;
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      background: #4a4a6a;
      cursor: not-allowed;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
    }
    .status.success {
      background: rgba(255, 71, 87, 0.2);
      border: 1px solid #ff4757;
      color: #ff4757;
    }
    .status.error {
      background: rgba(255, 71, 71, 0.2);
      border: 1px solid #ff4747;
      color: #ff4747;
    }
    .status.info {
      background: rgba(33, 150, 243, 0.2);
      border: 1px solid #2196f3;
      color: #2196f3;
    }
    .player {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 25px;
      margin-top: 30px;
    }
    .player h2 {
      color: white;
      margin-bottom: 20px;
      font-size: 1.3em;
    }
    .current-track {
      display: flex;
      align-items: center;
      padding: 20px;
      background: #2a2a4a;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .track-cover {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      object-fit: cover;
      margin-right: 20px;
    }
    .track-info {
      flex: 1;
    }
    .track-name {
      color: white;
      font-weight: 600;
      font-size: 1.2em;
      margin-bottom: 8px;
    }
    .track-artist {
      color: #888;
      font-size: 0.95em;
    }
    .track-album {
      color: #666;
      font-size: 0.85em;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #ff4757;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .control-btn:hover {
      background: #ff6b81;
    }
    .progress-container {
      width: 100%;
      margin-top: 20px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #2a2a4a;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #ff4757;
      width: 0%;
      transition: width 0.3s;
    }
    .search-results {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 20px;
      margin-top: 30px;
    }
    .search-results h2 {
      color: white;
      margin-bottom: 20px;
      font-size: 1.3em;
    }
    .search-item {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #2a2a4a;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: background 0.3s;
    }
    .search-item:hover {
      background: #3a3a5a;
    }
    .search-item img {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      margin-right: 15px;
    }
    .search-info {
      flex: 1;
    }
    .search-name {
      color: white;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .search-artist {
      color: #888;
      font-size: 0.9em;
    }
    .play-btn {
      padding: 8px 16px;
      background: #ff4757;
      font-size: 14px;
    }
    .play-btn:hover {
      background: #ff6b81;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Merci - Media Player</h1>
    
    <div class="input-group">
      <input type="text" id="searchInput" placeholder="Paste Spotify or YouTube URL...">
      <button id="searchBtn">Play</button>
    </div>
    
    <div id="status" class="status" style="display: none;"></div>
    
    <div class="player">
      <h2>Now Playing</h2>
      <div class="current-track">
        <img src="https://placehold.co/100x100/2a2a4a/888?text=Music" alt="Album Art" class="track-cover" id="trackCover">
        <div class="track-info">
          <div class="track-name" id="currentTrackName">Select a media to play</div>
          <div class="track-artist" id="currentTrackArtist">...</div>
          <div class="track-album" id="currentTrackAlbum">...</div>
        </div>
      </div>
      <div class="controls">
        <button class="control-btn" id="playBtn">▶</button>
      </div>
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div id="media-player-container" style="margin-top: 20px;"></div>
    </div>
    
    <div class="search-results" id="searchResults" style="display: none;">
      <h2>Search Results</h2>
      <div id="searchList"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const statusEl = document.getElementById('status');
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const searchResultsEl = document.getElementById('searchResults');
    const searchListEl = document.getElementById('searchList');
    const currentTrackName = document.getElementById('currentTrackName');
    const currentTrackArtist = document.getElementById('currentTrackArtist');
    const currentTrackAlbum = document.getElementById('currentTrackAlbum');
    const trackCover = document.getElementById('trackCover');
    const playBtn = document.getElementById('playBtn');
    const progressFill = document.getElementById('progressFill');
    const mediaPlayerContainer = document.getElementById('media-player-container');

    let currentTrack = null;
    let isPlaying = false;
    let ytPlayer = null;
    let loadTimeout = null;

    function showStatus(message, type = 'info') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      statusEl.style.display = 'block';
    }

    // YouTube API ready callback
    window.onYouTubeIframeAPIReady = function() {
      console.log('YouTube API ready');
    };

    async function loadTrack() {
      const url = searchInput.value.trim();
      if (!url) {
        showStatus('Please enter a URL', 'error');
        return;
      }

      console.log('loadTrack called with URL:', url);

      // Clear previous player immediately
      mediaPlayerContainer.innerHTML = '';
      currentTrack = null;
      isPlaying = false;
      playBtn.textContent = '▶';
      
      // Destroy old YouTube player if exists
      if (ytPlayer) {
        ytPlayer.destroy();
        ytPlayer = null;
      }
      
      // Show loading state
      searchBtn.disabled = true;
      searchBtn.innerHTML = '<span class="loading"></span> Loading...';
      showStatus('Loading media...', 'info');

      try {
        // Check if it's a Spotify URL
        if (url.includes('spotify.com')) {
          // Extract track ID
          const trackIdMatch = url.match(/spotify\.com\/[^/]+\/track\/([a-zA-Z0-9]+)/);
          if (!trackIdMatch) {
            throw new Error('Invalid Spotify track URL');
          }
          const trackId = trackIdMatch[1];
          
          // Create Spotify embed URL
          const embedUrl = `https://open.spotify.com/embed/track/${trackId}`;
          
          // Create Spotify iframe
          const iframe = document.createElement('iframe');
          iframe.src = embedUrl;
          iframe.width = '100%';
          iframe.height = '352';
          iframe.frameBorder = '0';
          iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
          iframe.loading = 'lazy';
          iframe.style.borderRadius = '12px';
          
          mediaPlayerContainer.appendChild(iframe);
          
          // Update track info
          currentTrackName.textContent = 'Spotify Track';
          currentTrackArtist.textContent = 'Loading...';
          currentTrackAlbum.textContent = 'Spotify';
          trackCover.src = 'https://placehold.co/100x100/2a2a4a/888?text=Music';
          
          showStatus('Spotify player loaded!', 'success');
          searchInput.value = '';
          searchResultsEl.style.display = 'none';
          
          isPlaying = true;
          playBtn.textContent = '⏸';
        } else {
          // Handle YouTube URL
          const response = await fetch(`/api/track?url=${encodeURIComponent(url)}`);
          const data = await response.json();

          if (response.ok) {
            currentTrack = data.track;
            updateTrackDisplay(data.track);
            showStatus(`Loaded: ${data.track.name}`, 'success');
            searchInput.value = '';
            searchResultsEl.style.display = 'none';
            playTrack(data.track);
          } else {
            throw new Error(data.error || 'Failed to load');
          }
        }
      } catch (error) {
        showStatus(`Error: ${error.message}`, 'error');
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = 'Play';
      }
    }

    async function searchTracks() {
      const query = searchInput.value.trim();
      if (!query) {
        showStatus('Please enter a search query', 'error');
        return;
      }

      searchBtn.disabled = true;
      searchBtn.innerHTML = '<span class="loading"></span> Searching...';
      showStatus('Searching...', 'info');

      try {
        const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (response.ok && data.tracks.length > 0) {
          searchListEl.innerHTML = '';
          data.tracks.forEach(track => {
            const item = document.createElement('div');
            item.className = 'search-item';
            item.innerHTML = `
              <img src="${track.cover || 'https://placehold.co/50x50/2a2a4a/888?text=Music'}" alt="${track.name}">
              <div class="search-info">
                <div class="search-name">${track.name}</div>
                <div class="search-artist">${track.artist}</div>
              </div>
              <button class="play-btn" data-track="${encodeURIComponent(JSON.stringify(track))}">Play</button>
            `;
            
            item.querySelector('button').addEventListener('click', () => {
              playTrack(track);
            });
            
            searchListEl.appendChild(item);
          });
          
          searchResultsEl.style.display = 'block';
          showStatus(`Found ${data.tracks.length} results`, 'success');
        } else {
          showStatus('No results found', 'error');
          searchResultsEl.style.display = 'none';
        }
      } catch (error) {
        showStatus(`Error: ${error.message}`, 'error');
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = 'Play';
      }
    }

    function updateTrackDisplay(track) {
      currentTrackName.textContent = track.name;
      currentTrackArtist.textContent = track.artist;
      currentTrackAlbum.textContent = track.album;
      trackCover.src = track.cover || 'https://placehold.co/100x100/2a2a4a/888?text=Music';
    }

    function playTrack(track) {
      currentTrack = track;
      updateTrackDisplay(track);
      
      // Clear previous player
      mediaPlayerContainer.innerHTML = '';
      
      // Create YouTube iframe
      const videoId = track.id;
      const player = new YT.Player(mediaPlayerContainer, {
        height: '300',
        width: '100%',
        videoId: videoId,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1,
          'playsinline': 1
        },
        events: {
          'onReady': function(event) {
            isPlaying = true;
            playBtn.textContent = '⏸';
            showStatus('Playing...', 'success');
          },
          'onStateChange': function(event) {
            if (event.data === YT.PlayerState.ENDED) {
              isPlaying = false;
              playBtn.textContent = '▶';
            }
          }
        }
      });
      
      ytPlayer = player;
    }

    playBtn.addEventListener('click', () => {
      if (!currentTrack) {
        showStatus('Please select a media first', 'error');
        return;
      }
      
      if (isPlaying) {
        if (ytPlayer) {
          ytPlayer.pauseVideo();
        }
        playBtn.textContent = '▶';
        isPlaying = false;
      } else {
        if (ytPlayer) {
          ytPlayer.playVideo();
        }
        playBtn.textContent = '⏸';
        isPlaying = true;
      }
    });

    searchBtn.addEventListener('click', () => {
      const url = searchInput.value.trim();
      if (url.includes('spotify.com')) {
        loadTrack();
      } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
        loadTrack();
      } else {
        searchTracks();
      }
    });

    searchInput.addEventListener('input', () => {
      const url = searchInput.value.trim();
      console.log('Input event fired, URL:', url);
      if (url.includes('spotify.com') || url.includes('youtube.com') || url.includes('youtu.be')) {
        console.log('Valid URL detected, calling loadTrack...');
        loadTrack();
      }
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const url = searchInput.value.trim();
        if (url.includes('spotify.com')) {
          loadTrack();
        } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
          loadTrack();
        } else {
          searchTracks();
        }
      }
    });
  </script>
</body>
</html>
