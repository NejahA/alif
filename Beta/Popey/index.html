<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Popey — Fruits & Vegetables</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Popey</h1>
    <p>A small demo about fruits and vegetables</p>
  </header>

  <nav class="controls">
    <button id="show-fruits">Fruits</button>
    <button id="show-vegetables">Vegetables</button>
  </nav>

  <main>
    <section id="fruits" class="grid">
      <article>
        <img src="assets/images/apple.png" alt="Apple">
        <h3>Apple</h3>
      </article>
      <article>
        <img src="assets/images/banana.png" alt="Banana">
        <h3>Banana</h3>
      </article>
    </section>

    <section id="vegetables" class="grid hidden">
      <article>
        <img src="assets/images/carrot.png" alt="Carrot">
        <h3>Carrot</h3>
      </article>
      <article>
        <img src="assets/images/broccoli.png" alt="Broccoli">
        <h3>Broccoli</h3>
      </article>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
