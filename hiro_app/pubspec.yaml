name: hiro_app
description: "A new Flutter project."
# Prevents the package from being accidentally published to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  pdf: ^3.10.0
  printing: ^5.12.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Fixes: "The method 'decodeLazy' isn't defined for the type 'ZLibDecoder'".
# image 4.11.0 needs a newer archive than the 4.0.9 that gets resolved, so
# pin image to the last version that works with archive 4.0.9.
# If this still fails, replace it with:  archive: ^4.5.2
dependency_overrides:
  image: 4.10.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/hiro_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/hiro_logo.png"
    background_color: "#050811"
    theme_color: "#38bdf8"
  windows:
    generate: true
    image_path: "assets/images/hiro_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/hiro_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
