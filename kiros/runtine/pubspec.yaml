name: runtine
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  usage_stats: ^1.1.0
  fl_chart: ^0.66.0
  lucide_icons_flutter: ^1.1.0
  intl: ^0.19.0
  provider: ^6.1.2
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/imac.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
