<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rémi</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glass-container">
    <header>
      <div class="logo-area">
        <img src="icon.png" alt="rémi logo" class="small-logo">
        <h1>rémi</h1>
      </div>
      <div class="status-indicator">
        <span id="status-dot" class="online"></span>
        <span id="status-text">Protected</span>
      </div>
    </header>

    <main>
      <div class="stats-card">
        <span class="label">Ads Blocked</span>
        <div class="counter-container">
          <span id="ad-count" class="counter">0</span>
          <span class="plus-icon">+</span>
        </div>
      </div>

      <div class="control-section">
        <div class="toggle-container">
          <span class="toggle-label">Active Protection</span>
          <label class="switch">
            <input type="checkbox" id="blocker-toggle" checked>
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </main>

    <footer>
      <p>Clean Web. Minimal Life.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
