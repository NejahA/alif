<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kittens</title>
  <style>
    body {
      width: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 24px;
    }
    .cat-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    button {
      background: #4a90d9;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #357abd;
    }
    .stats {
      margin-top: 16px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="cat-icon">🐱</div>
  <h1>Kittens</h1>
  <p>All images replaced with cats!</p>
  <button id="refresh">Refresh Page</button>
  <div class="stats" id="stats">0 images replaced</div>
  
  <script src="popup.js"></script>
</body>
</html>
