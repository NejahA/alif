<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3rifts — Beautifully Explained</title>
    <meta name="description" content="A premium reader for Wikipedia articles, focusing on typography and beauty.">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <div class="container">
      <header id="main-header">
        <h1 class="logo">3rifts</h1>
        <p style="color: var(--text-secondary); margin-top: -1.5rem; font-style: italic;">Wiki. Evolved.</p>
        <div class="search-container">
          <input type="text" id="search" placeholder="Explore anything..." autocomplete="off">
        </div>
      </header>

      <main id="app">
        <!-- Landing View -->
        <section id="landing-view">
          <div class="results-grid" id="featured-results">
            <!-- Featured / Search results will appear here -->
          </div>
        </section>

        <!-- Article View -->
        <section id="article-view" class="hidden">
          <button class="back-btn" id="back-btn">← Back to Explore</button>
          <div id="article-container">
            <!-- Article content will be injected here -->
          </div>
        </section>
      </main>

      <footer style="padding: 4rem 1rem; text-align: center; color: var(--text-secondary); border-top: 1px solid var(--glass-border); margin-top: 4rem;">
        <p>&copy; 2026 3rifts. Built with <span style="color: #d4af37;">♥</span> and Wikipedia API.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
