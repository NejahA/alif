<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quill - Quick Access</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }

        h1 {
            font-size: 24px;
            color: #5e72e4;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #5e72e4;
            color: white;
        }

        .btn-primary:hover {
            background: #4a5ec4;
        }

        .btn-secondary {
            background: #e1e1e1;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d1d1;
        }

        .last-entry {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e1e1e1;
        }

        .last-entry-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .last-entry-text {
            font-size: 13px;
            color: #333;
            line-height: 1.4;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <h1>Quill</h1>
    
    <div class="stats">
        <div class="stat-item">
            <div class="stat-value" id="popupStreak">0</div>
            <div class="stat-label">Days Streak</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="popupWordCount">0</div>
            <div class="stat-label">Words</div>
        </div>
    </div>

    <div class="quick-actions">
        <button class="btn-primary" id="openApp">Open Quill</button>
        <button class="btn-secondary" id="exportMarkdown">Export to Markdown</button>
        <button class="btn-secondary" id="exportPdf">Export to PDF</button>
    </div>

    <div class="last-entry">
        <div class="last-entry-label">Last Entry</div>
        <div class="last-entry-text" id="lastEntry"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
