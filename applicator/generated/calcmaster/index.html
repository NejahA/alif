<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CalcMaster</title><link rel="stylesheet" href="style.css"></head><body><div class="calc"><h1>🧮 CalcMaster</h1><div class="display"><div class="expr" id="expr"></div><div class="result" id="result">0</div></div><div class="buttons"><button class="btn-clr" onclick="c()">AC</button><button class="btn-fn" onclick="o('(')">(</button><button class="btn-fn" onclick="o(')')">)</button><button class="btn-op" onclick="o('/')">/</button><button class="btn-num" onclick="n('7')">7</button><button class="btn-num" onclick="n('8')">8</button><button class="btn-num" onclick="n('9')">9</button><button class="btn-op" onclick="o('*')">x</button><button class="btn-num" onclick="n('4')">4</button><button class="btn-num" onclick="n('5')">5</button><button class="btn-num" onclick="n('6')">6</button><button class="btn-op" onclick="o('-')">-</button><button class="btn-num" onclick="n('1')">1</button><button class="btn-num" onclick="n('2')">2</button><button class="btn-num" onclick="n('3')">3</button><button class="btn-op" onclick="o('+')">+</button><button class="btn-fn" onclick="n('0')">0</button><button class="btn-fn" onclick="n('.')">.</button><button class="btn-eq span-2" onclick="eq()">=</button></div></div>  <script src="script.js"></script>
</body></html>
