<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PassGen</title><link rel="stylesheet" href="style.css"></head><body><div class="card"><h1>🔐 PassGen</h1><div class="pw-display"><input id="pw" readonly value="P@ssw0rd!"><button onclick="copyPw()">Copy</button></div><div class="options"><div class="opt-row"><label>Length</label><input type="number" id="len" value="16" min="4" max="64"></div><div class="opt-row"><label>Uppercase (A-Z)</label><input type="checkbox" id="up" checked></div><div class="opt-row"><label>Lowercase (a-z)</label><input type="checkbox" id="low" checked></div><div class="opt-row"><label>Numbers (0-9)</label><input type="checkbox" id="num" checked></div><div class="opt-row"><label>Symbols (!@#)</label><input type="checkbox" id="sym" checked></div><div class="opt-row"><label>Exclude Similar</label><input type="checkbox" id="excl"></div></div><div class="strength"><span style="font-size:0.82rem;color:#888">Strength</span><div class="strength-bar"><div id="strBar" style="width:70%;background:#38ef7d"></div></div><span class="strength-label" id="strLabel">Strong</span></div><button class="gen" onclick="gen()">Generate Password</button></div>  <script src="script.js"></script>
</body></html>
