<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MemoryMatch</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:2rem;width:100%;max-width:500px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4)}h1{font-size:1.4rem;margin-bottom:0.5rem;color:#ffd200}.info{display:flex;justify-content:center;gap:1.5rem;margin-bottom:1rem;font-size:0.9rem;color:#a0a0c0}.info span{font-weight:700;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;margin-bottom:1.2rem;max-width:400px;margin-left:auto;margin-right:auto}.card-m{aspect-ratio:1;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.8rem;transition:transform 0.3s,background 0.3s;color:transparent;user-select:none}.card-m.flipped{background:rgba(255,255,255,0.1);color:#fff}.card-m.matched{background:rgba(56,239,125,0.2);color:#38ef7d;cursor:default}.controls{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap}.controls button{padding:0.6rem 1.3rem;font-size:0.85rem;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:transform 0.15s;font-family:inherit}.controls button:hover{transform:scale(1.05)}.btn-start{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}</style></head><body><div class="card"><h1>🧠 MemoryMatch</h1><div class="info">Moves: <span id="moves">0</span> - Matches: <span id="matches">0</span></div><div class="grid" id="grid"></div><div class="controls"><button class="btn-start" onclick="startGame()">New Game</button></div></div><script>const E=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];let cards=[],flipped=[],matched=0,moves=0,locked=false;function startGame(){cards=[...E,...E];for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}flipped=[];matched=0;moves=0;locked=false;document.getElementById('moves').textContent='0';document.getElementById('matches').textContent='0';render()}function render(){const g=document.getElementById('grid');g.innerHTML=cards.map((c,i)=>{const f=flipped.includes(i);const m=matched>0&&cards[i]===cards[flipped[0]]&&flipped.includes(i);return '<div class="card-m'+(f||m?' flipped':'')+(m?' matched':'')+'" onclick="flip('+i+')">'+(f||m?c:'')+'</div>'}).join('')}function flip(i){if(locked||flipped.length>=2||flipped.includes(i)||matched>=cards.length/2)return;flipped.push(i);render();if(flipped.length===2){moves++;document.getElementById('moves').textContent=moves;locked=true;const a=flipped[0],b=flipped[1];if(cards[a]===cards[b]){matched++;document.getElementById('matches').textContent=matched;flipped=[];locked=false}else{setTimeout(()=>{flipped=[];locked=false;render()},800)}}}startGame()</script></body></html>
