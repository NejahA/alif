<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>UnitConvert</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#2d3436,#636e72);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#fff;border-radius:20px;padding:2rem;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}h1{font-size:1.4rem;margin-bottom:1.2rem;color:#2d3436;text-align:center}.tabs{display:flex;gap:0.4rem;margin-bottom:1.2rem;flex-wrap:wrap}.tabs button{padding:0.5rem 0.9rem;border:1px solid #ddd;background:#fafafa;border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:0.2s;color:#666}.tabs button.active{background:#636e72;color:#fff;border-color:#636e72}.conv{display:flex;align-items:center;gap:0.8rem;margin-bottom:1rem}.conv input{flex:1;padding:0.8rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-size:1.1rem;outline:none}.conv input:focus{border-color:#636e72}.conv .swap{background:#f0f0f0;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.2rem}.conv select{padding:0.7rem;border:2px solid #e0e0e0;border-radius:10px;font-size:0.9rem;outline:none;background:#fafafa}}</style></head><body><div class="card"><h1>🔄 UnitConvert</h1><div class="tabs" id="tabs"><button class="active" onclick="setCat('length')">Length</button><button onclick="setCat('mass')">Mass</button><button onclick="setCat('temp')">Temp</button></div><div class="conv"><input id="val1" type="number" value="1" oninput="conv(1)"><select id="unit1" onchange="conv(1)"></select></div><div class="conv"><button class="swap" onclick="swap()">⇄</button></div><div class="conv"><input id="val2" type="number" value="" oninput="conv(2)"><select id="unit2" onchange="conv(2)"></select></div><div class="formula" id="formula" style="text-align:center;font-size:0.85rem;color:#888;margin-top:0.5rem"></div></div><script>const UNITS={length:{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.344,ft:0.3048,in:0.0254},mass:{kg:1,g:0.001,lb:0.453592,oz:0.0283495},temp:{'°C':'C','°F':'F','K':'K'}};let cat='length';const val1=document.getElementById('val1'),val2=document.getElementById('val2'),unit1=document.getElementById('unit1'),unit2=document.getElementById('unit2'),formula=document.getElementById('formula');function setCat(c){cat=c;document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('#tabs button')[['length','mass','temp'].indexOf(c)].classList.add('active');populateUnits();conv(1)}function populateUnits(){const units=UNITS[cat];unit1.innerHTML=Object.keys(units).map(u=>'<option value="'+u+'"'+(u===(cat==='temp'?'°C':cat==='mass'?'kg':'m')?' selected':'')+'>'+u+'</option>').join('');unit2.innerHTML=unit1.innerHTML}function swap(){const t=unit1.value;unit1.value=unit2.value;unit2.value=t;conv(1)}function conv(src){const units=UNITS[cat];const u1=unit1.value,u2=unit2.value;let v=src===1?parseFloat(val1.value):parseFloat(val2.value);if(isNaN(v))return;if(cat==='temp'){let c;if(src===1){if(u1==='°C')c=v;else if(u1==='°F')c=(v-32)*5/9;else c=v-273.15;let r;if(u2==='°C')r=c;else if(u2==='°F')r=c*9/5+32;else r=c+273.15;val2.value=Math.round(r*1000000)/1000000}else{if(u2==='°C')c=v;else if(u2==='°F')c=(v-32)*5/9;else c=v-273.15;let r;if(u1==='°C')r=c;else if(u1==='°F')r=c*9/5+32;else r=c+273.15;val1.value=Math.round(r*1000000)/1000000}formula.textContent='Temperature conversion';return}if(src===1){const base=v*units[u1];val2.value=Math.round(base/units[u2]*1000000)/1000000}else{const base=v*units[u2];val1.value=Math.round(base/units[u1]*1000000)/1000000}formula.textContent=val1.value+' '+u1+' = '+val2.value+' '+u2}populateUnits();conv(1)</script></body></html>
