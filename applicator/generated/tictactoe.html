<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TicTacToe</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#1e1e3a;border-radius:20px;padding:2rem;width:100%;max-width:380px;text-align:center;border:1px solid rgba(255,255,255,0.06);box-shadow:0 20px 60px rgba(0,0,0,0.4)}h1{font-size:1.3rem;margin-bottom:0.5rem;color:#e94560}.status{font-size:1.1rem;color:#a0a0d0;margin-bottom:1rem;min-height:1.5em}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1.2rem;max-width:300px;margin-left:auto;margin-right:auto}.cell{aspect-ratio:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-size:2.5rem;font-weight:800;cursor:pointer;transition:0.2s;display:flex;align-items:center;justify-content:center;color:#e0e0f0}.cell:hover{background:rgba(255,255,255,0.08)}.cell.x{color:#e94560}.cell.o{color:#38ef7d}.cell.win{background:rgba(56,239,125,0.15)}.score{display:flex;justify-content:center;gap:2rem;margin-bottom:1rem;font-size:0.9rem;color:#8888aa}.score span{font-weight:700;font-size:1.2rem;color:#e0e0f0}.controls{display:flex;gap:0.5rem;justify-content:center}.controls button{padding:0.6rem 1.2rem;font-size:0.85rem;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:transform 0.15s}.controls button:hover{transform:scale(1.05)}.btn-restart{background:#e94560;color:#fff}</style></head><body><div class="card"><h1>✖️ TicTacToe</h1><div class="status" id="status">X's turn</div><div class="score"><div>X <span id="scoreX">0</span></div><div>Draw <span id="scoreD">0</span></div><div>O <span id="scoreO">0</span></div></div><div class="board" id="board"></div><div class="controls"><button class="btn-restart" onclick="restart()">Restart</button></div></div><script>let b=['','','','','','','','',''],turn='X',over=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function render(){const brd=document.getElementById('board');brd.innerHTML=b.map((c,i)=>'<div class="cell '+(c==='X'?'x':c==='O'?'o':'')+'" onclick="move('+i+')">'+c+'</div>').join('')}function move(i){if(over||b[i])return;b[i]=turn;const w=checkWin(turn);if(w){over=true;w.forEach(j=>document.querySelectorAll('.cell')[j].classList.add('win'));document.getElementById('status').textContent=turn+' wins!';render();return}if(b.every(c=>c)){over=true;document.getElementById('status').textContent='Draw!';render();return}turn=turn==='X'?'O':'X';document.getElementById('status').textContent=turn+'\'s turn';render()}function checkWin(p){for(const w of wins)if(w.every(i=>b[i]===p))return w;return null}function restart(){b=['','','','','','','','',''];turn='X';over=false;render();document.getElementById('status').textContent="X's turn";document.querySelectorAll('.cell').forEach(c=>c.classList.remove('win'))}render()</script></body></html>
