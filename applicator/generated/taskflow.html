<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskFlow</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}h1{font-size:1.5rem;margin-bottom:1rem;color:#333}.input-row{display:flex;gap:0.5rem;margin-bottom:1rem}.input-row input{flex:1;padding:0.7rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-size:0.95rem;outline:none}.input-row input:focus{border-color:#667eea}.input-row button{padding:0.7rem 1.3rem;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer}.todo-list{list-style:none}.todo-item{display:flex;align-items:center;gap:0.7rem;padding:0.7rem 0;border-bottom:1px solid #f0f0f0}.todo-item:last-child{border-bottom:none}.todo-item input[type="checkbox"]{width:1.2rem;height:1.2rem;cursor:pointer;accent-color:#667eea}.todo-item .todo-text{flex:1;font-size:0.95rem;color:#444}.todo-item .todo-text.done{text-decoration:line-through;color:#aaa}.todo-item .delete-todo{background:none;border:none;color:#e74c3c;cursor:pointer;font-size:1rem;opacity:0.5}.todo-item .delete-todo:hover{opacity:1}.stats{display:flex;justify-content:space-between;margin-top:1rem;font-size:0.82rem;color:#888}</style></head><body><div class="card"><h1>📋 TaskFlow</h1><div class="input-row"><input id="todoInput" placeholder="Add a task..." autofocus><button onclick="addTodo()">Add</button></div><ul class="todo-list" id="todoList"></ul><div class="stats"><span id="todoCount">0 remaining</span><button onclick="clearDoneTodo()" style="background:none;border:none;color:#e74c3c;cursor:pointer;font-size:0.82rem">Clear done</button></div></div><script>let todos=JSON.parse(localStorage.getItem('todos_taskflow'))||[];function s(){localStorage.setItem('todos_taskflow',JSON.stringify(todos));r()}function r(){const l=document.getElementById('todoList');l.innerHTML=todos.map((x,i)=>'<li class="todo-item"><input type="checkbox"'+(x.done?' checked':'')+' onchange="toggleTodo('+i+')"><span class="todo-text'+(x.done?' done':'')+'">'+e(x.text)+'</span><button class="delete-todo" onclick="delTodo('+i+')">✕</button></li>').join('');document.getElementById('todoCount').textContent=todos.filter(x=>!x.done).length+' remaining'}function addTodo(){const i=document.getElementById('todoInput'),x=i.value.trim();if(!x)return;todos.push({text:x,done:false});i.value='';s()}function toggleTodo(i){todos[i].done=!todos[i].done;s()}function delTodo(i){todos.splice(i,1);s()}function clearDoneTodo(){todos=todos.filter(x=>!x.done);s()}function e(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}document.getElementById('todoInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTodo()});r()</script></body></html>
