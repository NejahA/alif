<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FocusPomo</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#e74c3c,#c0392b);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#fff;border-radius:20px;padding:2rem;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)}h1{font-size:1.4rem;margin-bottom:1.5rem;color:#c0392b}.mode{display:flex;gap:0.5rem;justify-content:center;margin-bottom:1rem}.mode button{padding:0.5rem 1rem;border:2px solid #e0e0e0;background:transparent;border-radius:8px;font-weight:600;cursor:pointer;color:#888;transition:0.2s;font-size:0.82rem}.mode button.active{border-color:#e74c3c;color:#e74c3c;background:rgba(231,76,60,0.05)}.timer{font-size:5rem;font-weight:800;color:#c0392b;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:1.5rem}.controls{display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:0.8rem}.controls button{padding:0.7rem 1.5rem;font-size:0.95rem;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:transform 0.15s}.controls button:hover{transform:scale(1.05)}.btn-start{background:#e74c3c;color:#fff}.btn-reset{background:#eee;color:#555}.session-count{font-size:0.85rem;color:#aaa;margin-top:0.5rem}</style></head><body><div class="card"><h1>🍅 FocusPomo</h1><div class="mode"><button class="active" onclick="setM('p')">Pomodoro</button><button onclick="setM('s')">Short</button><button onclick="setM('l')">Long</button></div><div class="timer" id="timer">25:00</div><div class="controls"><button class="btn-start" onclick="tog()" id="startBtn">Start</button><button class="btn-reset" onclick="resetT()">Reset</button></div><div class="session-count" id="sess">Sessions: 0</div></div><script>const D={p:25,s:5,l:15};let m='p',t=D.p*60,r=0,i=null,se=parseInt(localStorage.getItem('pomo_focuspomo')||'0');function u(){const m=Math.floor(t/60),s=t%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function setM(n){if(r)tog();m=n;document.querySelectorAll('.mode button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.mode button')['psl'.indexOf(n)].classList.add('active');t=D[n]*60;u()}function tog(){if(r){clearInterval(i);r=0;document.getElementById('startBtn').textContent='Resume';return}r=1;document.getElementById('startBtn').textContent='Pause';i=setInterval(()=>{t--;u();if(t<=0){clearInterval(i);r=0;document.getElementById('startBtn').textContent='Start';se++;localStorage.setItem('pomo_focuspomo',se.toString());document.getElementById('sess').textContent='Sessions: '+se;alert('Time up!');setM(m==='p'?'s':'p')}},1000)}function resetT(){if(r){clearInterval(i);r=0;document.getElementById('startBtn').textContent='Start'}t=D[m]*60;u()}document.getElementById('sess').textContent='Sessions: '+se;u()</script></body></html>
