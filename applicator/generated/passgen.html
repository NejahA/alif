<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PassGen</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#1e1e3a;border-radius:20px;padding:2rem;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.06)}h1{font-size:1.4rem;margin-bottom:1.5rem;color:#f7971e;text-align:center}.pw-display{background:#0f0f23;border-radius:12px;padding:1rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.7rem}.pw-display input{flex:1;background:none;border:none;color:#fff;font-size:1.3rem;font-family:'Courier New',monospace;outline:none;letter-spacing:0.05em}.pw-display button{background:#667eea;color:#fff;border:none;padding:0.5rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}.options{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.5rem}.opt-row{display:flex;align-items:center;justify-content:space-between}.opt-row label{color:#b0b0d0;font-size:0.88rem}.opt-row input[type="number"]{width:70px;padding:0.5rem;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e0e0f0;text-align:center;font-size:0.9rem}.opt-row input[type="checkbox"]{width:1.2rem;height:1.2rem;accent-color:#667eea;cursor:pointer}.strength{display:flex;align-items:center;gap:0.7rem;margin-bottom:1.5rem}.strength-bar{flex:1;height:6px;background:#333;border-radius:3px;overflow:hidden}.strength-bar div{height:100%;border-radius:3px;transition:width 0.3s,background 0.3s}.strength-label{font-size:0.82rem;color:#888;min-width:50px;text-align:right}button.gen{width:100%;padding:0.8rem;background:linear-gradient(135deg,#f7971e,#ffd200);color:#222;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform 0.15s}button.gen:hover{transform:translateY(-2px)}</style></head><body><div class="card"><h1>🔐 PassGen</h1><div class="pw-display"><input id="pw" readonly value="P@ssw0rd!"><button onclick="copyPw()">Copy</button></div><div class="options"><div class="opt-row"><label>Length</label><input type="number" id="len" value="16" min="4" max="64"></div><div class="opt-row"><label>Uppercase (A-Z)</label><input type="checkbox" id="up" checked></div><div class="opt-row"><label>Lowercase (a-z)</label><input type="checkbox" id="low" checked></div><div class="opt-row"><label>Numbers (0-9)</label><input type="checkbox" id="num" checked></div><div class="opt-row"><label>Symbols (!@#)</label><input type="checkbox" id="sym" checked></div><div class="opt-row"><label>Exclude Similar</label><input type="checkbox" id="excl"></div></div><div class="strength"><span style="font-size:0.82rem;color:#888">Strength</span><div class="strength-bar"><div id="strBar" style="width:70%;background:#38ef7d"></div></div><span class="strength-label" id="strLabel">Strong</span></div><button class="gen" onclick="gen()">Generate Password</button></div><script>const U='ABCDEFGHJKLMNPQRSTUVWXYZ',L='abcdefghjkmnpqrstuvwxyz',N='23456789',S='!@#$%^&*()_+-=[]{}|;:,.<>?';function gen(){const len=Math.min(64,Math.max(4,+document.getElementById('len').value||16));let chars='',ex=document.getElementById('excl').checked;if(document.getElementById('up').checked)chars+=ex?U:U+'O';if(document.getElementById('low').checked)chars+=ex?L:L+'il';if(document.getElementById('num').checked)chars+=ex?N:N+'01';if(document.getElementById('sym').checked)chars+=S;if(!chars){document.getElementById('pw').value='Select options';return}let pw='';for(let i=0;i<len;i++)pw+=chars[Math.floor(Math.random()*chars.length)];document.getElementById('pw').value=pw;upStr(pw.length,chars.length)}function upStr(l,p){const b=document.getElementById('strBar'),lb=document.getElementById('strLabel');let s=Math.min(100,(l/8)*25+(p/15)*35+(l>=12?20:0)+(l>=16?20:0));if(s<30){b.style.background='#e74c3c';lb.textContent='Weak'}else if(s<55){b.style.background='#fca311';lb.textContent='Medium'}else if(s<80){b.style.background='#38ef7d';lb.textContent='Strong'}else{b.style.background='#11998e';lb.textContent='Very Strong'}b.style.width=s+'%'}function copyPw(){const p=document.getElementById('pw');navigator.clipboard.writeText(p.value).then(()=>{const t=p.value;p.value='Copied!';setTimeout(()=>p.value=t,800)})}gen()</script></body></html>
