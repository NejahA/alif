<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ClickCounter</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#11998e,#38ef7d);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#fff;border-radius:16px;padding:2.5rem;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25)}h1{font-size:1.4rem;margin-bottom:1.5rem;color:#333}.number{font-size:5rem;font-weight:800;color:#11998e;line-height:1;margin-bottom:1.5rem}.buttons{display:flex;gap:0.7rem;justify-content:center}.buttons button{padding:0.8rem 1.5rem;font-size:1.1rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:transform 0.15s;min-width:70px}.buttons button:hover{transform:scale(1.05)}.btn-inc{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}.btn-dec{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}.btn-reset{background:#f0f0f0;color:#555}.steps{display:flex;gap:0.4rem;justify-content:center;margin:1rem 0}.steps button{padding:0.4rem 0.7rem;font-size:0.8rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fafafa}.steps button.active{background:#11998e;color:#fff;border-color:#11998e}.history{margin-top:1rem;font-size:0.82rem;color:#888}</style></head><body><div class="card"><h1>🔢 ClickCounter</h1><div class="number" id="display">0</div><div class="steps"><button class="active" onclick="setStep(1)">x1</button><button onclick="setStep(5)">x5</button><button onclick="setStep(10)">x10</button></div><div class="buttons"><button class="btn-dec" onclick="change(-step)">-</button><button class="btn-reset" onclick="resetCount()">Reset</button><button class="btn-inc" onclick="change(step)">+</button></div><div class="history" id="history"></div></div><script>let c=parseInt(localStorage.getItem('counter_clickcounter')||'0'),step=1,h=[];function r(){document.getElementById('display').textContent=c;document.getElementById('history').textContent=h.length?'History: '+h.slice(-8).join(', '):'';localStorage.setItem('counter_clickcounter',c.toString())}function change(n){c+=n;h.push((n>0?'+':'')+n);r()}function resetCount(){c=0;h.push('R');r()}function setStep(n){step=n;document.querySelectorAll('.steps button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.steps button')[n===1?0:n===5?1:2].classList.add('active')}r()</script></body></html>
