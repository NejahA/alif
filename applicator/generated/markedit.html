<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MarkEdit</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;padding:1rem;display:flex;align-items:center;justify-content:center}.card{background:#0f3460;border-radius:16px;padding:1.5rem;width:100%;max-width:900px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}h1{font-size:1.3rem;margin-bottom:1rem;color:#e94560;text-align:center}.panes{display:grid;grid-template-columns:1fr 1fr;gap:1rem;height:500px}.pane{background:#1a1a3e;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}.pane-header{padding:0.5rem 1rem;background:rgba(255,255,255,0.04);font-size:0.8rem;color:#8888aa;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid rgba(255,255,255,0.05)}textarea{flex:1;width:100%;padding:1rem;background:none;border:none;color:#e0e0f0;font-family:'Courier New',monospace;font-size:0.88rem;line-height:1.6;resize:none;outline:none}.preview{flex:1;padding:1rem;overflow-y:auto;color:#e0e0f0;font-size:0.92rem;line-height:1.6}.preview h1{color:#fff;font-size:1.5rem;margin:0.5rem 0;text-align:left}.preview h2{color:#e94560;font-size:1.2rem;margin:0.5rem 0;text-align:left}.preview code{background:rgba(255,255,255,0.06);padding:0.1em 0.3em;border-radius:4px;font-size:0.85em}.preview pre{background:#12122a;padding:0.8rem;border-radius:8px;overflow-x:auto;margin:0.5rem 0}.preview p{margin:0.4rem 0}</style></head><body><div class="card"><h1>📄 MarkEdit</h1><div class="panes"><div class="pane"><div class="pane-header">Markdown</div><textarea id="mdInput" placeholder="Type Markdown..."># Hello

This is **bold** and *italic*.

## Features
- Lists
- **Bold**
- `code`</textarea></div><div class="pane"><div class="pane-header">Preview</div><div class="preview" id="preview"></div></div></div></div><script>const md=document.getElementById('mdInput'),pv=document.getElementById('preview');function render(){function e(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}const t=md.value;let h=e(t);h=h.replace(/### (.+)/g,'<h3>$1</h3>');h=h.replace(/## (.+)/g,'<h2>$1</h2>');h=h.replace(/# (.+)/g,'<h1>$1</h1>');h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');h=h.replace(/`(.+?)`/g,'<code>$1</code>');h=h.replace(/!\[(.*?)\]\((.*?)\)/g,'<img src="$2" alt="$1">');h=h.replace(/\[(.*?)\]\((.*?)\)/g,'<a href="$2">$1</a>');h=h.replace(/^> (.+)/gm,'<blockquote>$1</blockquote>');h=h.replace(/^\* (.+)/gm,'<li>$1</li>');h=h.replace(/^- (.+)/gm,'<li>$1</li>');h=h.replace(/^\d+\. (.+)/gm,'<li>$1</li>');h=h.replace(/^---+$/gm,'<hr>');h=h.replace(/\n\n/g,'</p><p>');h='<p>'+h+'</p>';pv.innerHTML=h}md.addEventListener('input',render);render()</script></body></html>
