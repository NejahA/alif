<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CalcMaster</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#2c3e50,#3498db);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.calc{background:#1a1a2e;border-radius:20px;padding:1.5rem;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}h1{font-size:1rem;margin-bottom:0.8rem;color:#6a82fb;text-align:center}.display{background:#0f0f23;border-radius:12px;padding:1rem 1.2rem;margin-bottom:1rem;text-align:right}.display .expr{font-size:0.85rem;color:#666;min-height:1.2em;word-break:break-all}.display .result{font-size:2.2rem;font-weight:700;color:#fff;min-height:1.4em}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem}.buttons button{padding:0.8rem;font-size:1.1rem;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:transform 0.1s}.buttons button:active{transform:scale(0.93)}.btn-num{background:#2a2a4a;color:#e0e0f0}.btn-op{background:#3a3a6a;color:#6a82fb}.btn-eq{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.btn-clr{background:#4a2a2a;color:#e74c3c}.btn-fn{background:#2a3a2a;color:#38ef7d}.span-2{grid-column:span 2}</style></head><body><div class="calc"><h1>🧮 CalcMaster</h1><div class="display"><div class="expr" id="expr"></div><div class="result" id="result">0</div></div><div class="buttons"><button class="btn-clr" onclick="c()">AC</button><button class="btn-fn" onclick="o('(')">(</button><button class="btn-fn" onclick="o(')')">)</button><button class="btn-op" onclick="o('/')">/</button><button class="btn-num" onclick="n('7')">7</button><button class="btn-num" onclick="n('8')">8</button><button class="btn-num" onclick="n('9')">9</button><button class="btn-op" onclick="o('*')">x</button><button class="btn-num" onclick="n('4')">4</button><button class="btn-num" onclick="n('5')">5</button><button class="btn-num" onclick="n('6')">6</button><button class="btn-op" onclick="o('-')">-</button><button class="btn-num" onclick="n('1')">1</button><button class="btn-num" onclick="n('2')">2</button><button class="btn-num" onclick="n('3')">3</button><button class="btn-op" onclick="o('+')">+</button><button class="btn-fn" onclick="n('0')">0</button><button class="btn-fn" onclick="n('.')">.</button><button class="btn-eq span-2" onclick="eq()">=</button></div></div><script>let e='';function r(){document.getElementById('expr').textContent=e;try{if(e)document.getElementById('result').textContent=eval(e)}catch(ee){}}function n(v){e+=v;r()}function o(v){if(e&&/[\d)]$/.test(e)){e+=v;r()}}function eq(){try{if(e){const x=eval(e);document.getElementById('result').textContent=x;e=String(x)}}catch(ee){document.getElementById('result').textContent='Error'}}function c(){e='';document.getElementById('result').textContent='0';document.getElementById('expr').textContent=''}document.addEventListener('keydown',ev=>{if(/[\d.()]/.test(ev.key))n(ev.key);else if('+-*/'.includes(ev.key))o(ev.key);else if(ev.key==='Enter'||ev.key==='=')eq();else if(ev.key==='Backspace'){e=e.slice(0,-1);r()}})</script></body></html>
