<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ClickCounter</title><link rel="stylesheet" href="style.css"></head><body><div class="card"><h1>🔢 ClickCounter</h1><div class="number" id="display">0</div><div class="steps"><button class="active" onclick="setStep(1)">x1</button><button onclick="setStep(5)">x5</button><button onclick="setStep(10)">x10</button></div><div class="buttons"><button class="btn-dec" onclick="change(-step)">-</button><button class="btn-reset" onclick="resetCount()">Reset</button><button class="btn-inc" onclick="change(step)">+</button></div><div class="history" id="history"></div></div>  <script src="script.js"></script>
</body></html>
