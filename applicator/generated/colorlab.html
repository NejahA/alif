<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ColorLab</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#16213e;border-radius:20px;padding:2rem;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4)}h1{font-size:1.3rem;margin-bottom:1.5rem;color:#e94560}.preview{width:100%;height:160px;border-radius:14px;margin-bottom:1.5rem;transition:background 0.15s;border:3px solid rgba(255,255,255,0.1)}.controls{display:flex;flex-direction:column;gap:0.8rem}.row{display:flex;align-items:center;gap:0.8rem}.row label{width:25px;font-weight:700;color:#a0a0c0;font-size:0.85rem}.row input[type="range"]{flex:1;accent-color:#e94560;height:6px}.row .v{min-width:35px;text-align:right;color:#e0e0f0;font-weight:600;font-size:0.85rem}.picker-row{display:flex;gap:0.8rem;justify-content:center;margin-top:0.5rem}.picker-row input[type="color"]{width:50px;height:50px;border:none;border-radius:10px;cursor:pointer;background:none}.picker-row input[type="color"]::-webkit-color-swatch-wrapper{padding:0}.picker-row input[type="color"]::-webkit-color-swatch{border:2px solid rgba(255,255,255,0.15);border-radius:8px}.hex{display:flex;justify-content:center;gap:0.5rem;margin-top:1rem;background:#0f0f23;padding:0.7rem;border-radius:10px;font-family:'Courier New',monospace;font-size:1.1rem;color:#fff;cursor:pointer}.hex span{background:rgba(255,255,255,0.05);padding:0.2rem 0.6rem;border-radius:6px;font-size:0.75rem;color:#888}</style></head><body><div class="card"><h1>🎨 ColorLab</h1><div class="preview" id="preview"></div><div class="controls"><div class="row"><label>R</label><input type="range" min="0" max="255" value="102" id="r"><span class="v" id="rv">102</span></div><div class="row"><label>G</label><input type="range" min="0" max="255" value="126" id="g"><span class="v" id="gv">126</span></div><div class="row"><label>B</label><input type="range" min="0" max="255" value="234" id="b"><span class="v" id="bv">234</span></div><div class="picker-row"><input type="color" id="cp" value="#667eea"></div><div class="hex" id="hexD" onclick="copyH()">#667eea <span>Copy</span></div></div></div><script>const rS=document.getElementById('r'),gS=document.getElementById('g'),bS=document.getElementById('b');const rV=document.getElementById('rv'),gV=document.getElementById('gv'),bV=document.getElementById('bv');const pv=document.getElementById('preview'),hx=document.getElementById('hexD'),cp=document.getElementById('cp');function up(){const r=+rS.value,g=+gS.value,b=+bS.value;rV.textContent=r;gV.textContent=g;bV.textContent=b;const hex='#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');pv.style.background=hex;hx.childNodes[0].textContent=hex;cp.value=hex}function fp(){const c=cp.value;rS.value=parseInt(c.slice(1,3),16);gS.value=parseInt(c.slice(3,5),16);bS.value=parseInt(c.slice(5,7),16);up()}function copyH(){navigator.clipboard.writeText(hx.childNodes[0].textContent.trim()).then(()=>{const t=hx.innerHTML;hx.innerHTML='Copied!';setTimeout(()=>hx.innerHTML=t,1200)})}rS.addEventListener('input',up);gS.addEventListener('input',up);bS.addEventListener('input',up);cp.addEventListener('input',fp);up()</script></body></html>
