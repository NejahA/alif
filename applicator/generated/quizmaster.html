<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QuizMaster</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#6a11cb,#2575fc);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#fff;border-radius:20px;padding:2rem;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}h1{font-size:1.3rem;margin-bottom:0.5rem;color:#333}.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem}.progress .count{font-size:0.82rem;color:#888}.progress .bar{flex:1;height:4px;background:#e0e0e0;border-radius:2px;margin:0 1rem;overflow:hidden}.progress .bar div{height:100%;background:linear-gradient(90deg,#6a11cb,#2575fc);border-radius:2px;transition:width 0.3s}.q{font-size:1.1rem;font-weight:600;color:#444;margin-bottom:1rem;line-height:1.5}.opts{display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1.2rem}.opt{padding:0.8rem 1rem;border:2px solid #e0e0e0;border-radius:10px;cursor:pointer;font-size:0.95rem;transition:0.2s;background:#fafafa;color:#444}.opt:hover{border-color:#6a11cb;background:#f0edff}.opt.sel{border-color:#6a11cb;background:#6a11cb;color:#fff}.opt.cor{border-color:#11998e;background:#11998e;color:#fff}.opt.wro{border-color:#e74c3c;background:#e74c3c;color:#fff}.next{width:100%;padding:0.8rem;background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform 0.15s}.next:hover{transform:translateY(-2px)}.next:disabled{opacity:0.5;cursor:not-allowed;transform:none}.result{text-align:center}.result .score{font-size:4rem;font-weight:800;color:#6a11cb;margin-bottom:0.5rem}.result .msg{font-size:1.1rem;color:#666;margin-bottom:1.5rem}.result .restart{padding:0.8rem 2rem;background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer}</style></head><body><div class="card"><h1>❓ QuizMaster</h1><div id="quizBody"></div></div><script>const ALL_Q=[{q:'What does HTML stand for?',o:['Hyper Text Markup Language','High Tech Modern Language','Home Tool Management Language','Hyper Transfer Markup Language'],a:0},{q:'Which language runs in a web browser?',o:['Java','C++','Python','JavaScript'],a:3},{q:'What is the capital of France?',o:['London','Berlin','Paris','Madrid'],a:2},{q:'What year was JavaScript created?',o:['1993','1995','1998','2000'],a:1},{q:'What does CSS stand for?',o:['Computer Style Sheets','Cascading Style Sheets','Creative Style System','Colorful Style Sheets'],a:1},{q:'Which planet is known as the Red Planet?',o:['Venus','Jupiter','Mars','Saturn'],a:2},{q:'What is the chemical symbol for water?',o:['H2O','CO2','NaCl','O2'],a:0},{q:'Which data structure uses FIFO?',o:['Stack','Queue','Tree','Graph'],a:1}];let questions=[...ALL_Q],cur=0,score=0,ans=false;const body=document.getElementById('quizBody');function render(){if(cur>=questions.length){showR();return}const q=questions[cur];body.innerHTML='<div class="progress"><span class="count">'+(cur+1)+' / '+questions.length+'</span><div class="bar"><div style="width:'+((cur)/questions.length*100)+'%"></div></div></div><div class="q">'+q.q+'</div><div class="opts">'+q.o.map((o,i)=>'<div class="opt" onclick="sel('+i+')">'+o+'</div>').join('')+'</div><button class="next" id="nextBtn" disabled onclick="nextQ()">Next</button>';ans=false}function sel(i){if(ans)return;const q=questions[cur];const opts=document.querySelectorAll('.opt');opts.forEach((o,idx)=>{o.classList.remove('sel','cor','wro');if(idx===i)o.classList.add('sel')});ans=true;const s=opts[i];if(i===q.a){s.classList.add('cor');score++}else{s.classList.add('wro');opts[q.a].classList.add('cor')}document.getElementById('nextBtn').disabled=false}function nextQ(){cur++;render()}function showR(){const p=Math.round(score/questions.length*100);const m=p>=80?'Excellent!':p>=60?'Good job!':'Keep practicing!';body.innerHTML='<div class="result"><div class="score">'+score+' / '+questions.length+'</div><div class="msg">'+m+' ('+p+'%)</div><button class="restart" onclick="restart()">Try Again</button></div>'}function restart(){cur=0;score=0;render()}render()</script></body></html>
