<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WeatherNow</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#1a2a6c,#b21f1f,#fdbb2d);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(16px);border-radius:20px;padding:2rem;width:100%;max-width:400px;text-align:center;border:1px solid rgba(255,255,255,0.15);box-shadow:0 20px 60px rgba(0,0,0,0.3)}h1{font-size:1.3rem;margin-bottom:0.3rem;color:#fff}.sub{font-size:0.82rem;color:rgba(255,255,255,0.6);margin-bottom:1.5rem}.search{display:flex;gap:0.5rem;margin-bottom:1.5rem}.search input{flex:1;padding:0.7rem 1rem;border:1px solid rgba(255,255,255,0.2);border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;font-size:0.95rem;outline:none}.search input::placeholder{color:rgba(255,255,255,0.4)}.search input:focus{border-color:rgba(255,255,255,0.5)}.search button{padding:0.7rem 1.2rem;background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:10px;cursor:pointer;font-weight:600}.wicon{font-size:4rem;margin-bottom:0.5rem}.temp{font-size:3.5rem;font-weight:800;color:#fff;line-height:1;margin-bottom:0.3rem}.cond{font-size:1.1rem;color:rgba(255,255,255,0.8);margin-bottom:0.3rem}.city{font-size:1.1rem;color:rgba(255,255,255,0.7);margin-bottom:1.2rem}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:0.7rem}.detail{background:rgba(255,255,255,0.08);border-radius:12px;padding:0.7rem}.detail .l{font-size:0.7rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.05em}.detail .v{font-size:1rem;font-weight:700;color:#fff;margin-top:0.2rem}.note{margin-top:1rem;font-size:0.75rem;color:rgba(255,255,255,0.35)}</style></head><body><div class="card"><h1>🌤️ WeatherNow</h1><p class="sub">Browser weather demo</p><div class="search"><input id="city" placeholder="Enter city..." value="Tunis"><button onclick="fw()">Search</button></div><div id="wd"><div class="wicon">🌤️</div><div class="temp">24°C</div><div class="cond">Partly Cloudy</div><div class="city">📍 Tunis</div><div class="details"><div class="detail"><div class="l">Humidity</div><div class="v">58%</div></div><div class="detail"><div class="l">Wind</div><div class="v">12 km/h</div></div><div class="detail"><div class="l">Feels</div><div class="v">23°C</div></div></div></div><p class="note">Demo - Try: Tunis, London, Tokyo, Paris, Dubai, New York</p></div><script>const D={tunis:{t:24,c:'Partly Cloudy',h:58,w:12,f:23,i:'🌤️',co:'Tunisia'},london:{t:12,c:'Light Rain',h:75,w:18,f:10,i:'🌧️',co:'UK'},tokyo:{t:18,c:'Clear',h:45,w:8,f:17,i:'☀️',co:'Japan'},paris:{t:15,c:'Cloudy',h:65,w:14,f:13,i:'☁️',co:'France'},dubai:{t:38,c:'Sunny',h:20,w:10,f:36,i:'☀️',co:'UAE'},newyork:{t:20,c:'Fair',h:55,w:16,f:19,i:'🌤️',co:'USA'}};function fw(){const i=document.getElementById('city'),c=i.value.trim().toLowerCase().replace(/\s/g,'');const d=D[c];if(!d){document.getElementById('wd').innerHTML='<p style="color:rgba(255,255,255,0.7);padding:1rem">City not found</p>';return}const n=c.charAt(0).toUpperCase()+c.slice(1);document.getElementById('wd').innerHTML='<div class="wicon">'+d.i+'</div><div class="temp">'+d.t+'°C</div><div class="cond">'+d.c+'</div><div class="city">📍 '+n+', '+d.co+'</div><div class="details"><div class="detail"><div class="l">Humidity</div><div class="v">'+d.h+'%</div></div><div class="detail"><div class="l">Wind</div><div class="v">'+d.w+' km/h</div></div><div class="detail"><div class="l">Feels</div><div class="v">'+d.f+'°C</div></div></div>'}document.getElementById('city').addEventListener('keydown',e=>{if(e.key==='Enter')fw()})</script></body></html>
