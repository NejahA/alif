<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StopWatch Pro</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Courier New',monospace;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{background:#0f3460;border-radius:20px;padding:2.5rem;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}h1{font-size:1.3rem;margin-bottom:1.5rem;color:#e94560;letter-spacing:0.05em}.timer{font-size:4rem;font-weight:800;color:#fff;letter-spacing:0.05em;margin-bottom:1.5rem;font-variant-numeric:tabular-nums}.controls{display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:1rem}.controls button{padding:0.7rem 1.4rem;font-size:0.9rem;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:transform 0.15s;font-family:inherit;text-transform:uppercase;letter-spacing:0.05em}.controls button:hover{transform:scale(1.05)}.btn-start{background:#e94560;color:#fff}.btn-stop{background:#fca311;color:#222}.btn-reset{background:#333;color:#ccc}.laps{margin-top:1rem;max-height:150px;overflow-y:auto}.lap{display:flex;justify-content:space-between;padding:0.3rem 0.5rem;color:#a0a0c0;font-size:0.8rem;border-bottom:1px solid rgba(255,255,255,0.05)}.lap .lap-num{color:#666}</style></head><body><div class="card"><h1>⏱️ StopWatch Pro</h1><div class="timer" id="display">00:00.00</div><div class="controls"><button class="btn-start" onclick="start()" id="startBtn">Start</button><button class="btn-stop" onclick="lap()">Lap</button><button class="btn-reset" onclick="resetT()">Reset</button></div><div class="laps" id="laps"></div></div><script>let ms=0,r=0,i=null,l=[],lc=0;function f(t){return String(Math.floor(t/60000)).padStart(2,'0')+':'+String(Math.floor((t%60000)/1000)).padStart(2,'0')+'.'+String(Math.floor((t%1000)/10)).padStart(2,'0')}function u(){document.getElementById('display').textContent=f(ms)}function start(){if(r){clearInterval(i);r=0;document.getElementById('startBtn').textContent='Resume';return}r=1;document.getElementById('startBtn').textContent='Pause';i=setInterval(()=>{ms+=10;u()},10)}function lap(){if(!r)return;lc++;l.push(ms);document.getElementById('laps').innerHTML=l.map((x,i)=>'<div class="lap"><span class="lap-num">Lap '+(i+1)+'</span><span>'+f(x)+'</span></div>').reverse().join('')}function resetT(){clearInterval(i);r=0;ms=0;lc=0;l=[];document.getElementById('startBtn').textContent='Start';document.getElementById('laps').innerHTML='';u()}u()</script></body></html>
