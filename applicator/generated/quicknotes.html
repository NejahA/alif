<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QuickNotes</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#fc5c7d,#6a82fb);min-height:100vh;padding:1rem;display:flex;align-items:center;justify-content:center}.card{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:550px;box-shadow:0 20px 60px rgba(0,0,0,0.25)}h1{font-size:1.5rem;margin-bottom:1rem;color:#333}.input-row{display:flex;gap:0.5rem;margin-bottom:1rem}.input-row input{flex:1;padding:0.7rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-size:0.95rem;outline:none}.input-row input:focus{border-color:#6a82fb}.input-row button{padding:0.7rem 1.3rem;background:linear-gradient(135deg,#fc5c7d,#6a82fb);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer}.note-grid{display:grid;gap:0.6rem}.note{background:#f8f9ff;border-radius:10px;padding:1rem;border:1px solid #e8e8f0;display:flex;align-items:flex-start;gap:0.7rem}.note .note-text{flex:1;font-size:0.92rem;color:#444;line-height:1.4;word-break:break-word}.note .note-time{font-size:0.72rem;color:#aaa;white-space:nowrap}.note .del-btn{background:none;border:none;color:#e74c3c;cursor:pointer;font-size:1rem;opacity:0.5;padding:0.2rem}.note .del-btn:hover{opacity:1}.empty{text-align:center;color:#aaa;padding:2rem;font-size:0.9rem}.search-note{margin-bottom:0.8rem}.search-note input{width:100%;padding:0.6rem 1rem;border:1px solid #e0e0e0;border-radius:8px;font-size:0.85rem;outline:none}.search-note input:focus{border-color:#6a82fb}</style></head><body><div class="card"><h1>📝 QuickNotes</h1><div class="input-row"><input id="noteInput" placeholder="Write a note..." autofocus><button onclick="addNote()">Add</button></div><div class="search-note"><input id="searchNote" placeholder="Search notes..." oninput="render()"></div><div class="note-grid" id="noteGrid"></div></div><script>let n=JSON.parse(localStorage.getItem('notes_quicknotes'))||[];function s(){localStorage.setItem('notes_quicknotes',JSON.stringify(n));render()}function render(){const q=document.getElementById('searchNote').value.toLowerCase();const g=document.getElementById('noteGrid');let f=n;if(q)f=f.filter(x=>x.text.toLowerCase().includes(q));if(!f.length){g.innerHTML='<div class="empty">'+(n.length?'No matching notes':'No notes yet')+'</div>';return}g.innerHTML=f.map((x,i)=>'<div class="note"><div class="note-text">'+e(x.text)+'</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem"><button class="del-btn" onclick="del('+n.indexOf(x)+')">X</button><span class="note-time">'+(x.time||'')+'</span></div></div>').join('')}function addNote(){const i=document.getElementById('noteInput'),x=i.value.trim();if(!x)return;const d=new Date();n.push({text:x,time:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});i.value='';s()}function del(i){n.splice(i,1);s()}function e(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}document.getElementById('noteInput').addEventListener('keydown',e=>{if(e.key==='Enter')addNote()});render()</script></body></html>
