<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:;">
  <title>Regulator — 432 Hz Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg viewBox="0 0 48 48" width="48" height="48">
          <circle cx="24" cy="24" r="20" fill="none" stroke="#7c5cbf" stroke-width="2.5" opacity="0.3"/>
          <circle cx="24" cy="24" r="14" fill="none" stroke="#7c5cbf" stroke-width="2" opacity="0.5"/>
          <circle cx="24" cy="24" r="8" fill="none" stroke="#a78bfa" stroke-width="2"/>
          <line x1="24" y1="4" x2="24" y2="16" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
          <line x1="24" y1="32" x2="24" y2="44" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
          <line x1="4" y1="24" x2="16" y2="24" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
          <line x1="32" y1="24" x2="44" y2="24" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="3" fill="#a78bfa">
            <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
          </circle>
        </svg>
        <h1>Regulator</h1>
      </div>
      <p class="subtitle">440 Hz → 432 Hz Converter</p>
    </header>

    <main>
      <section class="card input-section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <h2>Input Audio</h2>
        </div>
        <div class="file-drop-zone" id="dropZone">
          <div class="drop-icon">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <polyline points="9 15 12 12 15 15"/>
            </svg>
          </div>
          <p class="drop-text">Drag & drop audio file here</p>
          <p class="drop-hint">or</p>
          <button class="btn" id="selectBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Browse Files
          </button>
          <div class="format-badge">MP3, WAV, FLAC, OGG, M4A</div>
        </div>
        <div class="file-info hidden" id="fileInfo">
          <div class="file-details">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#a78bfa" stroke-width="2">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <div>
              <span id="fileName">—</span>
              <span class="file-size" id="fileSize">—</span>
            </div>
          </div>
          <button class="btn btn-small btn-outline" id="removeBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Remove
          </button>
        </div>
      </section>

      <section class="card conversion-section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          <h2>Conversion</h2>
        </div>
        <div class="tuning-display">
          <div class="tuning-row">
            <div class="freq-badge source">
              <span class="freq-label">Source</span>
              <span class="freq-value">440 Hz</span>
            </div>
            <div class="arrow-convert">
              <svg viewBox="0 0 48 16" width="80" height="24">
                <line x1="4" y1="12" x2="40" y2="12" stroke="#4a4a5a" stroke-width="2"/>
                <polyline points="36 8 42 12 36 16" fill="none" stroke="#a78bfa" stroke-width="2"/>
              </svg>
            </div>
            <div class="freq-badge target">
              <span class="freq-label">Target</span>
              <span class="freq-value">432 Hz</span>
            </div>
          </div>
          <div class="shift-info">
            <span class="shift-label">Pitch shift:</span>
            <span class="shift-value">−31.77 cents</span>
            <span class="shift-sub">(ratio: 0.9818)</span>
          </div>
        </div>

        <div class="progress-container hidden" id="progressContainer">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>
          <span class="progress-text" id="progressText">0%</span>
        </div>

        <button class="btn btn-primary btn-large" id="convertBtn" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span id="convertBtnText">Convert to 432 Hz</span>
        </button>
      </section>

      <section class="card output-section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <h2>Output</h2>
        </div>
        <div class="output-controls">
          <button class="btn btn-outline" id="previewBtn" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            Preview
          </button>
          <button class="btn btn-primary" id="saveBtn" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            Save As
          </button>
        </div>
        <div class="status-message hidden" id="statusMessage"></div>
      </section>
    </main>

    <footer>
      <p>Regulator v1.0 — Real-time 440 Hz to 432 Hz pitch conversion</p>
    </footer>
  </div>

  <div class="visualizer-container">
    <canvas id="visualizer"></canvas>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="renderer.js"></script>
</body>
</html>
